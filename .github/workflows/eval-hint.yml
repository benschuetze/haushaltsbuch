name: Eval-Hinweis

# Changes to the categorisation are measured with `pnpm eval` before merging (skill categorizer-eval). That run
# costs money and stays manual; this only reminds, once per pull request.
on:
  pull_request:
    paths:
      - "app/lib/categorize/**"
      - "evals/**"

# Commenting is all it does: no checkout, no third-party action, no access to the code or to secrets.
permissions:
  pull-requests: write

jobs:
  hint:
    # Pull requests from forks get a read-only token; there is nothing to remind there.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Kommentar, falls noch keiner da ist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker="<!-- eval-hinweis -->"
          if gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[].body' | grep -qF "$marker"; then
            echo "Hinweis steht schon da."
            exit 0
          fi
          gh pr comment "$PR" --repo "$REPO" --body "$marker
          Dieser PR ändert die Kategorisierung. Vor dem Merge bitte \`pnpm eval\` ausführen (Skill \`categorizer-eval\`, kostet ein paar Cent) und vorher/nachher in die PR-Beschreibung schreiben. Bei geändertem Prompt \`PROMPT_VERSION\` erhöhen."
